<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusCrew – Local Business & Creator Platform</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet.js for Interactive Discovery Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="css/style.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#090D16] text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Top Glass Navigation Bar -->
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        
        <!-- Brand Logo & Tagline -->
        <a href="#" class="flex items-center gap-3 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-600/30 group-hover:scale-105 transition">
            <span class="text-white font-black text-lg">C</span>
          </div>
          <div class="flex flex-col">
            <span class="text-base font-extrabold text-white tracking-tight leading-none">CampusCrew</span>
            <span class="text-[10px] text-indigo-400 font-semibold tracking-wider uppercase mt-0.5 hidden sm:inline">Local Business & Creator Hub</span>
          </div>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden md:flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-800/80">
          <a href="#explore" class="nav-link px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
            Creators
          </a>
          <a href="#campaigns" class="nav-link px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
            Campaigns
          </a>
          <a href="#collaborations" class="nav-link px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
            Collab Hub
          </a>
          <a href="#analytics" class="nav-link px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
            ROI Analytics
          </a>
          <a href="#map" class="nav-link px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
            Local Map
          </a>
          <a href="#briefs" class="nav-link px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
            AI Briefs
          </a>
          <a href="#student-hub" class="nav-link px-3.5 py-1.5 rounded-lg text-xs font-semibold text-purple-400 hover:text-purple-300 transition">
            Student Hub
          </a>
        </nav>

        <!-- Right Side: Demo Persona Switcher & Profile -->
        <div class="flex items-center gap-3">
          <!-- Role Switcher Dropdown Button -->
          <div class="relative group">
            <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 text-xs font-semibold text-slate-300 hover:text-white transition">
              <span>🎭 Role Demo</span>
              <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>

            <!-- Dropdown Menu -->
            <div class="absolute right-0 mt-1 w-56 rounded-xl bg-slate-950 border border-slate-800 shadow-2xl p-1.5 hidden group-hover:block z-50">
              <div class="px-2.5 py-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800">
                Switch Live Persona
              </div>
              <button onclick="App.showRoleDemo('business')" class="w-full text-left px-2.5 py-2 rounded-lg text-xs text-slate-200 hover:bg-slate-900 hover:text-indigo-400 flex items-center justify-between transition">
                <span>🏢 Business: SNR Nati Ruchi</span>
                <span class="text-[10px] text-slate-500">Restaurant</span>
              </button>
              <button onclick="App.showRoleDemo('creator')" class="w-full text-left px-2.5 py-2 rounded-lg text-xs text-slate-200 hover:bg-slate-900 hover:text-indigo-400 flex items-center justify-between transition">
                <span>📸 Creator: Aditya Kumar</span>
                <span class="text-[10px] text-slate-500">Food Lead</span>
              </button>
              <button onclick="App.showRoleDemo('student')" class="w-full text-left px-2.5 py-2 rounded-lg text-xs text-slate-200 hover:bg-slate-900 hover:text-purple-400 flex items-center justify-between transition">
                <span>🎓 Student: Alex Rivera</span>
                <span class="text-[10px] text-slate-500">Editor</span>
              </button>
              <button onclick="App.showRoleDemo('admin')" class="w-full text-left px-2.5 py-2 rounded-lg text-xs text-slate-200 hover:bg-slate-900 hover:text-amber-400 flex items-center justify-between border-t border-slate-800/80 mt-1 transition">
                <span>🛡️ Super Admin Panel</span>
                <span class="text-[10px] text-slate-500">Gov</span>
              </button>
            </div>
          </div>

          <!-- User Header Container -->
          <div id="user-header-profile"></div>
        </div>

      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="main-content" class="flex-1">
    <!-- Populated by App.handleRoute() -->
  </main>

  <!-- Global Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-950 py-10 mt-auto text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
        <span class="font-bold text-slate-300">CampusCrew</span>
        <span>– Hyperlocal Business & Creator Platform. Fully Functional Web Application.</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="#explore" class="hover:text-slate-300 transition">Creators</a>
        <a href="#campaigns" class="hover:text-slate-300 transition">Campaigns</a>
        <a href="#student-hub" class="hover:text-slate-300 transition">Student Hub</a>
        <a href="#admin" class="hover:text-slate-300 transition">Admin Governance</a>
      </div>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Dynamic Modal Root -->
  <div id="modal-root"></div>

  <!-- Application Scripts -->
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
